<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Financeiro">
  <title>Painel Financeiro</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
  <link rel="apple-touch-icon" href="/icone.svg">
</head>
<body>
  <nav class="tabbar" id="tabbar">
    <button class="on" data-tab="resumo"><span class="ic">📊</span>Resumo</button>
    <button data-tab="agenda"><span class="ic">📅</span>Agenda<span class="badge" id="badgeAgenda" hidden></span></button>
    <button data-tab="cartoes"><span class="ic">💳</span>Cartões</button>
    <button data-tab="pessoas"><span class="ic">👥</span>Pessoas</button>
    <button data-tab="historico"><span class="ic">🧾</span>Histór.</button>
    <button data-tab="mais"><span class="ic">⚙️</span>Mais</button>
  </nav>

  <header class="topbar" id="topbar">
    <h1 id="tbTitulo">Resumo<span class="sub" id="tbSub">carregando…</span></h1>
    <span class="status" id="tbStatus"></span>
  </header>

  <main id="main"><div class="empty"><span class="big">⏳</span>Carregando…</div></main>

  <button class="fab" id="fab" aria-label="Lançar gasto">+</button>

  <div id="sheetHost"></div>
  <div id="toastHost"></div>
  <script src="/app.js"></script>
</body>
</html>
